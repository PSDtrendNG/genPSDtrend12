    * { box-sizing: border-box; margin: 0; padding: 0; }

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header { text-align: center; padding: 12px 0 8px; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--red-600);
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 6px;
    }
    .card {
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .counter {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--red-600);
      text-align: center;
      padding: 10px 16px;
      background: var(--red-50);
      border-radius: 10px;
      border: 1px solid var(--red-200);
    }
    .preview-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .preview {
      background: var(--red-50);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 140px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.55;
      word-break: break-word;
    }
    .preview.empty {
      color: var(--text-light);
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      width: 100%;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--red-500);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(224, 49, 49, 0.35);
    }
    .btn-primary:hover { background: var(--red-600); }
    .btn-primary:disabled {
      background: var(--red-300);
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-secondary {
      background: var(--white);
      color: var(--red-600);
      border: 2px solid var(--red-300);
    }
    .btn-secondary:hover {
      background: var(--red-50);
      border-color: var(--red-400);
    }
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
      padding: 8px 12px;
      background: var(--red-50);
      border-radius: 8px;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--red-700);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    footer {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-light);
      text-align: center;
    }
    @media (min-width: 480px) {
      h1 { font-size: 2rem; }
      .actions { flex-direction: row; }
      .actions button { flex: 1; }
    }
  </style>
</head>

            "keluarga PerthSantaDomiia lucu banget",
            "momen keluarga PerthSantaDomiia bikin meleleh",
            "kelucuan keluarga PerthSantaDomiia unreal",
            "vibe keluarga PerthSantaDomiia is everything",
            "ngeliat keluarga PerthSantaDomiia pure joy"
          ],
          domiia: [
            "Domiia lucu banget",
            "energi Domiia pure sunshine",
            "Domiia adorable dan lively",
            "Domiia bawa banyak cuteness",
            "vibe playful Domiia curi perhatian"
          ],
          energy: [
            "energi keluarga PSD penuh kehidupan",
            "energi vibrant keluarga PSD nyalain semuanya",
            "gaya energik keluarga PSD menular",
            "keluarga PSD bawa energi hangat dan hidup",
            "kehadiran keluarga PSD pure positive energy"
          ],
          thanks: [
            "terima kasih King Power sudah undang keluarga PSD",
            "bersyukur ke King Power yang undang PSD",
            "makasih King Power sudah bawa PerthSanta dan Domiia",
            "appreciate King Power yang undang PSD",
            "terima kasih King Power untuk momen spesial ini dengan PSD"
          ],
          closers: [
            "Absolute win.", "Gini caranya.", "Simply outstanding.",
            "Pura cinta.", "Beneran menghangatkan.", "Terus aja.",
            "Ini beda.", "Pura joy.", "Well executed.", "Bagus banget."
          ]
        }
      };

      const LANG_KEYS = Object.keys(LANGS);

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function capitalize(str) {
        if (!str) return str;
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function buildComment(lang) {
        const L = LANGS[lang];
        const roll = Math.random();
        let parts = [];

        // Random structure emphasizing different themes
        const themeRoll = Math.random();
        if (themeRoll < 0.15) {
          // visual + handsome
          parts = [pick(L.openings), pick(L.visual) + '.', pick(L.handsome) + '.', pick(L.closers)];
        } else if (themeRoll < 0.30) {
          // family + domiia
          parts = [pick(L.openings), pick(L.family) + '.', pick(L.domiia) + '.', pick(L.closers)];
        } else if (themeRoll < 0.45) {
          // energy + thanks
          parts = [pick(L.openings), pick(L.energy) + '.', pick(L.thanks) + '.', pick(L.closers)];
        } else if (themeRoll < 0.60) {
          // visual + family + thanks
          parts = [pick(L.openings), pick(L.visual) + '.', pick(L.family) + '.', pick(L.thanks) + '.'];
        } else if (themeRoll < 0.75) {
          // handsome + domiia + energy
          parts = [pick(L.openings), pick(L.handsome) + '.', pick(L.domiia) + '.', pick(L.energy) + '.'];
        } else if (themeRoll < 0.88) {
          // short: one main theme
          const themes = [L.visual, L.handsome, L.family, L.domiia, L.energy, L.thanks];
          parts = [pick(L.openings), pick(pick(themes)) + '.', pick(L.closers)];
        } else {
          // longer mix
          parts = [pick(L.openings), pick(L.family) + '.', pick(L.domiia) + '.', pick(L.thanks) + '.', pick(L.closers)];
        }

        let body = parts.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
        // For CJK languages, capitalization less critical; for others apply
        if (['en', 'es', 'id'].includes(lang)) {
          body = capitalize(body);
        }
        if (!/[.!?。！？]$/.test(body)) {
          body += (['zh', 'ja'].includes(lang) ? '。' : '.');
        }
        return body;
      }

      function generateCommentBody() {
        const lang = pick(LANG_KEYS);
        let body = buildComment(lang);
        if (body.length > MAX_BODY) {
          body = body.slice(0, MAX_BODY - 1).trim();
          if (!/[.!?。！？]$/.test(body)) {
            body += (['zh', 'ja'].includes(lang) ? '。' : '.');
          }
        }
        return body;
      }

      function formatFullComment(body) {
        return body + FIXED_SUFFIX;
      }

      const STORAGE_KEY = 'xcg_psd_kingpower_multi_v1';
      let state = { count: 0, history: [] };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.count === 'number' && Array.isArray(parsed.history)) {
              state = parsed;
            }
          }
        } catch (e) {}
      }

      function saveState() {
        try {
          if (state.history.length > 1500) {
            state.history = state.history.slice(-1500);
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      let lastFullComment = null;

      function updateUI() {
        document.getElementById('counter').textContent = `Đã copy: ${state.count} comment`;
        const preview = document.getElementById('preview');
        if (lastFullComment) {
          preview.textContent = lastFullComment;
          preview.classList.remove('empty');
          document.getElementById('btnPost').disabled = false;
        }
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function generateUnique() {
        for (let i = 0; i < 120; i++) {
          const body = generateCommentBody();
          if (!state.history.includes(body)) return body;
        }
        return generateCommentBody();
      }

      async function generateAndCopy(alsoPost) {
        const body = generateUnique();
        const full = formatFullComment(body);

        try {
          await navigator.clipboard.writeText(full);
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = full;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); }
          catch (e2) {
            showToast('Copy failed. Please copy manually.');
            lastFullComment = full;
            updateUI();
            return;
          }
          document.body.removeChild(ta);
        }

        lastFullComment = full;
        state.count += 1;
        state.history.push(body);
        saveState();
        updateUI();
        showToast(alsoPost ? 'Copied & opening X' : 'Comment copied');

        if (alsoPost) {
          setTimeout(() => {
            const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(full);
            window.open(url, '_blank', 'noopener,noreferrer');
          }, 300);
        }
      }

      document.getElementById('btnGenerate').addEventListener('click', () => generateAndCopy(false));
      document.getElementById('btnPost').addEventListener('click', () => generateAndCopy(true));

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          generateAndCopy(true);
        }
      });

      loadState();
      updateUI();
    })();
  </script>
</body>
